[package]
name = "mmx-studio"
version = "1.0.0"
edition = "2021"

[lib]
name = "mmx_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs-next = "2"
ureq = { version = "2", features = ["json"] }
